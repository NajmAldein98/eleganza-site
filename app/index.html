<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيق إليغانزا</title>
<meta name="description" content="تابع ثوبك من القص إلى الاستلام، وصمّمه، واعرف قصة قماشه — تطبيق إليغانزا للخياطة.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#EFE3CF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إليغانزا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#EFE3CF;--bg2:#E6D6BC;--card:#FBF6EC;--ink:#2B2217;--mute:#7C6A52;--gold:#B69A66;--gold2:#9A7B43;--goldL:#E3CB93;--bk:#1C1813;--line:#DCCAAA;--red:#B5452F;--ok:#3E7A57}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0,#F6EBD8,#E4D2B4);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.ttl{font-family:"Reem Kufi",sans-serif;margin:0;line-height:1.25;text-wrap:balance;font-weight:700}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
a{color:inherit}
.hide{display:none!important}
/* ===== الشعار ===== */
.gw{position:relative;display:inline-block;line-height:0}
.gw img{height:46px;width:auto;filter:saturate(1.25) brightness(.92) drop-shadow(0 0 .6px #4a3510) drop-shadow(0 0 .6px #4a3510) drop-shadow(0 3px 6px #9a7b4366)}
.gem{position:absolute;width:var(--gs,16%);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;z-index:1}
.gem::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff6d0 22%,#ffd86a66 50%,transparent 72%);opacity:.35;animation:gemGlow 3.4s ease-in-out infinite}
.gem::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff 30%,#fff3c4 60%,transparent 75%);clip-path:polygon(50% 0,55% 45%,100% 50%,55% 55%,50% 100%,45% 55%,0 50%,45% 45%);opacity:0;transform:scale(.2);animation:gemStar 3.4s ease-in-out infinite}
@keyframes gemStar{0%,58%,100%{opacity:0;transform:scale(.2) rotate(0)}70%{opacity:1;transform:scale(1) rotate(45deg)}84%{opacity:0;transform:scale(.3) rotate(90deg)}}
@keyframes gemGlow{0%,56%,100%{opacity:.3}70%{opacity:1}86%{opacity:.4}}
/* ===== شرح التثبيت ===== */
#guide{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 10px}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ghead a{margin-inline-start:auto;font-size:14px;color:var(--gold2);text-decoration:none}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 12px 30px #9a7b4322;position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--gold2),var(--goldL),var(--gold2))}
.gcard h1{font-size:28px;margin:6px 0 6px}
.gsteps{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px;counter-reset:s}
.gsteps li{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
.gsteps li::before{content:counter(s);width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font:700 18px "Reem Kufi"}
.gsteps b{display:block}
.gsteps svg{width:22px;height:22px;vertical-align:-5px;margin:0 2px;color:#1a73e8}
.arrowdown{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;margin:26px 4px 4px}
.arrowdown::before,.arrowdown::after{content:"";flex:1;height:1px;background:var(--line)}
.qrbox{width:170px;margin:14px auto 0;background:#fff;padding:10px;border-radius:16px}
.qrbox svg{width:100%;height:auto;display:block}
.pointer{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;background:var(--bk);color:var(--goldL);padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:0 10px 30px #0004;animation:nudge 1.4s ease-in-out infinite;white-space:nowrap}
.pointer::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--bk);border-bottom:0}
@keyframes nudge{50%{transform:translateX(-50%) translateY(-6px)}}
/* ===== التطبيق ===== */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
body:not(.pwa) .app{margin:16px auto 0;border-radius:30px 30px 0 0;box-shadow:0 -10px 40px #9a7b4322;overflow:hidden;min-height:90vh}
header.top{position:sticky;top:0;z-index:6;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(160deg,#F7ECD9ee,#EAD7B6ee 70%,#DDC394ee);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;overflow:hidden}
header.top .thread{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.6}
.thread path{stroke-dasharray:3 5;animation:sew 14s linear infinite}
@keyframes sew{to{stroke-dashoffset:-160}}
.hello{margin-inline-start:auto;font-size:13px;color:var(--mute);text-align:left;position:relative}
.hello b{display:block;color:var(--ink);font-size:14px}
main{flex:1;padding:16px 16px calc(100px + env(safe-area-inset-bottom));display:grid;gap:14px;align-content:start}
main>*{animation:up .5s both cubic-bezier(.2,.8,.2,1)}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 18px #9a7b431a}
.card.gold{background:linear-gradient(150deg,#C9AD74,#B69A66 45%,#9A7B43);color:#fff;border:0;position:relative;overflow:hidden}
.card.gold .mute{color:#FFF3DC}
.card.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff40 50%,transparent 65%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
.card.gold>*{position:relative;z-index:1}
.gold.media{background:#1C1813}
.gold.media>video,.gold.media>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.gold.media::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(150deg,#c9ad74e6,#b69a66b3 50%,#7d6233d9)}
.gold.media>div{z-index:2}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.h1{font-size:26px}.h2{font-size:20px}.h3{font-size:16px}
.kick{font-size:13px;color:var(--gold2);font-weight:600;display:flex;align-items:center;gap:8px}
.kick::before{content:"";width:22px;height:1px;background:var(--gold)}
.saleh{display:flex;gap:12px;align-items:flex-end}
.av{flex:none;width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 6px 16px #9a7b4340;animation:bob 3s ease-in-out infinite;background:#D9BC84}
.av img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{transform:translateY(-3px)}}
.bubble{background:#fff;border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px;flex:1;box-shadow:0 6px 16px #9a7b431a}
.bubble .ttl{font-size:13px;color:var(--gold2);margin-bottom:2px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-inline-end:3px;animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}
.vbox{position:relative;border-radius:22px;overflow:hidden;background:#1C1813}
.vbox video,.vbox img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vbox .ov{position:absolute;inset:0;background:linear-gradient(transparent 35%,#1c1813e6)}
.vbox .tx{position:relative;z-index:1;color:#FBF6EC;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.hero{height:220px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid}
.steps li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:7px 0;position:relative}
.steps li::before{content:"";position:absolute;right:15px;top:36px;bottom:-7px;width:2px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 7px)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--gold)}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--card);z-index:1;font-size:13px;color:var(--mute)}
.done .dot{background:var(--gold);border-color:var(--gold);color:#fff}
.now .dot{border-color:var(--gold);color:var(--gold2);font-weight:700;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #b69a6699}100%{box-shadow:0 0 0 13px #b69a6600}}
.clip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:4px 10px;font-size:13px;min-height:36px;display:flex;align-items:center;gap:6px;color:var(--gold2)}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--goldL));border-radius:99px;transition:width 1s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;min-height:40px;font-size:14px;transition:all .2s}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:0 4px 12px #9a7b4340}
.btn{border:0;background:linear-gradient(135deg,#C9AD74,#B69A66 50%,#9A7B43);color:#fff;font-weight:600;border-radius:16px;padding:12px 16px;min-height:50px;width:100%;box-shadow:0 8px 18px #9a7b4340;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:16px}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-100%);animation:shine 3.8s ease-in-out infinite}
.btn.ghost{background:#fff;color:var(--gold2);border:1px solid var(--line);box-shadow:none}
.btn.ghost::after,.btn.dark::after{display:none}
.btn.dark{background:var(--bk);color:var(--goldL)}
.btn:disabled{opacity:.6}
.btn:active{transform:scale(.98)}
.field{display:grid;gap:6px;font-size:14px;color:var(--mute)}
.in{font-size:18px;min-height:54px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;letter-spacing:2px;text-align:center}
.msg{min-height:1.4em;font-size:14px;color:var(--gold2);text-align:center}.msg.bad{color:var(--red)}
.studio{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
@media(max-width:360px){.studio{grid-template-columns:1fr}}
.thobe{background:radial-gradient(circle at 50% 30%,#fff,#F3E7D2);border-radius:18px;border:1px solid var(--line);padding:8px}
.thobe svg{width:100%;height:auto;display:block}
.opt h3{font-size:14px;margin-top:10px;color:var(--mute);font-family:"IBM Plex Sans Arabic";font-weight:600}
.opt h3:first-child{margin-top:0}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--gold)}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;width:100%;text-align:start;box-shadow:0 4px 12px #9a7b4314;text-decoration:none}
.item .ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--gold2)}
.item .ic svg{width:26px;height:26px}
.tag{font-size:12px;border-radius:99px;padding:3px 10px;background:#fff;border:1px solid var(--line);white-space:nowrap;color:var(--gold2)}
.tag.ok{color:var(--ok);border-color:#9cc4ab}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.stamps span{aspect-ratio:1;border-radius:50%;border:2px dashed #ffffff88;display:grid;place-items:center;font-size:12px;color:#FFF3DC}
.stamps span.on{border:2px solid #fff;background:radial-gradient(#fff 0 34%,transparent 36%)}
.stamps span.gift{border-style:solid;font-weight:600;color:#fff}
.scan{position:relative;height:200px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#E6D6BC url(../media/chalk.webp) center 40%/cover}
.scan .corner{position:absolute;width:26px;height:26px;border:3px solid var(--gold)}
.scan .beam{position:absolute;inset-inline:0;height:3px;top:0;background:var(--gold);box-shadow:0 0 18px 6px #e3cb9399;animation:beam 2.6s ease-in-out infinite}
@keyframes beam{50%{top:calc(100% - 3px)}}
.swbig{height:150px;border-radius:18px;border:1px solid #0001;background-image:repeating-linear-gradient(0deg,#0000000d 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#0000000d 0 1px,transparent 1px 3px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}.kv dt{color:var(--mute)}.kv dd{margin:0}
.runway{position:relative;height:420px;border-radius:24px;overflow:hidden;background:radial-gradient(70% 50% at 50% 100%,#3a2e1d,#120f0b 70%);border:1px solid #9a7b43}
.runway>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.runway .light{position:absolute;top:-40px;width:160px;height:520px;background:linear-gradient(#fff6d880,transparent 75%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:top center;animation:sweep 4s ease-in-out infinite alternate;mix-blend-mode:screen}
.runway .l1{right:-30px;transform:rotate(18deg)}.runway .l2{left:-30px;transform:rotate(-18deg);animation-delay:-2s}
@keyframes sweep{to{transform:rotate(0)}}
.runway .floor{position:absolute;bottom:0;left:50%;width:150%;height:55%;transform:translateX(-50%) perspective(260px) rotateX(58deg);background:repeating-linear-gradient(90deg,#2b2216 0 2px,transparent 2px 60px),linear-gradient(#3a2e1d,#B69A66);border-top:2px solid var(--goldL)}
.runway .model{position:absolute;left:50%;bottom:22%;width:120px;transform:translateX(-50%);animation:walk 5s ease-in-out infinite;transform-origin:bottom center}
@keyframes walk{0%{transform:translateX(-50%) scale(.45) translateY(-60px);opacity:0}15%{opacity:1}70%{transform:translateX(-50%) scale(1.05) translateY(0)}85%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1.05);opacity:0}}
.runway .name{position:absolute;bottom:16px;inset-inline:0;text-align:center;color:var(--goldL);font:700 20px "Reem Kufi";text-shadow:0 2px 12px #000}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 5s infinite}
@keyframes flash{0%,72%,76%,100%{opacity:0}74%{opacity:.5}}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#FBF6ECf2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:8}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;font-size:11.5px;color:var(--mute);display:grid;justify-items:center;gap:2px;min-height:54px;position:relative}
nav.tabs button svg{width:23px;height:23px;transition:transform .25s}
nav.tabs button.on{color:var(--gold2);font-weight:600}
nav.tabs button.on svg{transform:translateY(-2px)}
nav.tabs button.on::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:9px;background:var(--gold)}
.sheet{position:fixed;inset:0;background:#2b22174d;display:none;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
.sheet.open{display:flex}
.sheet .inn{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;display:grid;gap:12px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(60%)}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.x{border:0;background:var(--card);border-radius:50%;width:40px;height:40px;font-size:20px;color:var(--mute)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-160px);background:#fff;color:var(--ink);padding:12px 18px;border-radius:16px;z-index:30;transition:transform .4s cubic-bezier(.2,.8,.2,1);max-width:90vw;font-size:14px;border:1px solid var(--gold);box-shadow:0 12px 30px #9a7b4340}
.toast.show{transform:translateX(-50%) translateY(0)}
.note{font-size:14px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:31;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.empty{text-align:center;padding:26px 16px;color:var(--mute)}
.skel{height:120px;border-radius:22px;background:linear-gradient(90deg,var(--card),#fff,var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.intro{position:fixed;inset:0;z-index:40;background:#000;display:grid;place-items:center;transition:opacity .6s}
.intro.out{opacity:0;visibility:hidden}
.intro video{width:100%;height:100%;object-fit:cover;max-width:560px}
.skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #E3CB9366;background:#00000055;color:#E3CB93;border-radius:99px;padding:8px 18px;font-size:14px;min-height:40px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- شرح عمل الاختصار: يظهر فقط في المتصفح، ولا يظهر أبداً عند الفتح من أيقونة الجوال -->
<section id="guide" class="hide" aria-label="طريقة تثبيت التطبيق">
  <div class="ghead">
    <span class="gw"><img src="../img/logo-crown.png" alt="إليغانزا للخياطة"><i class="gem" style="left:78.9%;top:23.3%;--gs:15%"></i></span>
    <a href="../">الموقع ←</a>
  </div>
  <div class="gcard">
    <div class="kick">تطبيق إليغانزا</div>
    <h1>ثبّت التطبيق على جوالك</h1>
    <p class="mute" style="margin:0" id="gLead">تابع ثوبك من القص إلى الاستلام، وصمّمه، واعرف قصة قماشه، وبطاقة ولائك معك دائماً.</p>
    <div id="gBody"></div>
  </div>
  <div class="arrowdown">أو جرّب التطبيق هنا الآن</div>
</section>

<div class="app">
  <header class="top">
    <svg class="thread" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true"><path d="M-10 70 C 80 20, 160 95, 240 50 S 360 10, 420 40" fill="none" stroke="#B69A66" stroke-width="1.4"/></svg>
    <span class="gw"><img src="../img/logo-crown.png" alt="إليغانزا للخياطة"><i class="gem" style="left:78.9%;top:23.3%;--gs:15%"></i></span>
    <div class="hello" id="hello"></div>
  </header>
  <main id="view"><div class="skel"></div></main>
  <nav class="tabs" id="nav" aria-label="أقسام التطبيق"></nav>
</div>

<div class="sheet" id="sheet"><div class="inn" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const API=/netlify\.app$|^localhost|^127\./.test(location.hostname)?"/api/elg/":"https://eleganza-tailor.netlify.app/api/elg/";
const WA_DEF="966575300170";
const $=id=>document.getElementById(id);

 const st=dark?"#00000055":"#B5A98F",tr=dark?"#E3CB93":"#9A7B43",pale=dark?"#ffffff22":"#F1E8D6";
 const collar={"عادية":`<path d="M88 34 Q100 46 112 34" fill="none" stroke="${tr}" stroke-width="3"/>`,"نصف":`<path d="M86 32 Q100 50 114 32 L114 27 Q100 40 86 27Z" fill="${pale}" stroke="${tr}" stroke-width="1.5"/>`,"واقفة":`<rect x="86" y="20" width="28" height="14" rx="4" fill="${pale}" stroke="${tr}" stroke-width="1.5"/>`}[d.collar];
 const close=d.close==="أزرار"?[56,70,84,98].map(y=>`<circle cx="100" cy="${y}" r="2.6" fill="${tr}"/>`).join(""):`<line x1="100" y1="46" x2="100" y2="104" stroke="${tr}" stroke-width="2"/><rect x="97" y="100" width="6" height="9" rx="2" fill="#B69A66"/>`;
 const cuff=d.sleeve==="كبك"?`<rect x="18" y="146" width="22" height="12" rx="2" fill="${pale}" stroke="${tr}"/><rect x="160" y="146" width="22" height="12" rx="2" fill="${pale}" stroke="${tr}"/><circle cx="29" cy="152" r="2.5" fill="#B69A66"/><circle cx="171" cy="152" r="2.5" fill="#B69A66"/>`:"";
 const pocket=d.pocket==="نعم"?`<path d="M62 62h20v4H62z" fill="${tr}"/>`:"";
 const g=`<path d="M84 30 Q100 38 116 30 L150 44 L184 150 L160 158 L140 96 L142 290 L58 290 L60 96 L40 158 L16 150 L50 44Z" fill="${f.c}" stroke="${st}" stroke-width="2"/><path d="M60 96 L58 290M140 96L142 290" stroke="${dark?"#00000033":"#E1D8C6"}"/>${collar}${close}${cuff}${pocket}`;
 return bare?g:`<svg viewBox="0 0 200 300" aria-label="معاينة الثوب">${g}</svg>`}
function model(d){return `<svg viewBox="0 0 200 380"><ellipse cx="100" cy="372" rx="50" ry="7" fill="#000" opacity=".5"/><circle cx="100" cy="36" r="20" fill="#C9A37A"/><path d="M76 30c6-22 42-22 48 0-8-6-40-6-48 0z" fill="#fff"/><path d="M74 40c-6 12-4 30 6 40M126 40c6 12 4 30-6 40" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M77 30c3-4 43-4 46 0" stroke="#B5452F" stroke-width="2" stroke-dasharray="3 3" fill="none"/><g transform="translate(0,70)">${thobeSVG(d,true)}</g></svg>`}
function vStudio(){const d=S.design;const g=(k,t,opts)=>`<h3>${t}</h3><div class="chips">${opts.map(v=>`<button class="chip ${d[k]===v?"on":""}" data-act="opt" data-k="${k}" data-v="${v}">${v}</button>`).join("")}</div>`;
 return `<div><div class="kick">استوديو إليغانزا</div><h1 class="h1" style="margin-top:4px">صمّم ثوبك قبل لا تجي</h1></div>
 <section class="card"><div class="studio"><div class="thobe">${thobeSVG(d)}</div>
 <div class="opt"><h3>القماش</h3><div class="chips">${FAB.map(f=>`<button class="sw ${d.fab===f.i?"on":""}" style="background:${f.c}" data-act="opt" data-k="fab" data-v="${f.i}" aria-label="${esc(f.n)}"></button>`).join("")}</div><div class="mute" style="margin-top:4px">${esc((FAB[d.fab]||FAB[0]).n)}</div>
 ${g("collar","الياقة",["عادية","نصف","واقفة"])}${g("sleeve","الكم",["سادة","كبك"])}${g("close","الإغلاق",["أزرار","سحاب"])}${g("pocket","جيب الصدر",["نعم","لا"])}</div></div></section>
 <button class="btn" data-act="runway">شاهد ثوبك على منصة العرض</button>
 <a class="btn ghost" href="${wa(designMsg())}" target="_blank" rel="noopener">أرسل تصميمي للمحل</a>
 <p class="mute" style="text-align:center;margin:0">التطريز والتصاميم الخاصة تشوفها في المحل.</p>`}
function designMsg(){const d=S.design,f=FAB[d.fab]||FAB[0];return `السلام عليكم، هذا تصميم ثوبي من تطبيق إليغانزا${S.me?" (ملف "+S.me.file+")":""}:\nالقماش: ${f.n}\nالياقة: ${d.collar}\nالكم: ${d.sleeve}\nالإغلاق: ${d.close}\nجيب الصدر: ${d.pocket}`}

/* ===== القماش ===== */
function vFabric(){return `<div><div class="kick">قصة القماش</div><h1 class="h1" style="margin-top:4px">امسح رول القماش في المحل</h1><p class="mute" style="margin:4px 0 0">كل رول في المحل عليه رمز. افتح كاميرا جوالك ووجّهها عليه، وتنفتح قصته هنا.</p></div>
 <div class="scan"><span class="corner" style="top:14px;right:14px;border-width:3px 3px 0 0"></span><span class="corner" style="top:14px;left:14px;border-width:3px 0 0 3px"></span><span class="corner" style="bottom:14px;right:14px;border-width:0 3px 3px 0"></span><span class="corner" style="bottom:14px;left:14px;border-width:0 0 3px 3px"></span><span class="beam"></span></div>
 <section class="card"><b class="ttl h3">أقمشتنا</b><div class="list" style="margin-top:10px">${FAB.map(f=>`<button class="item" data-act="fab" data-f="${f.i}"><span class="ic" style="background:${f.c};border:1px solid var(--line)"></span><span class="grow"><b>${esc(f.n)}</b><br><span class="mute">${esc(f.sea)} · ${esc(f.feel)}</span></span></button>`).join("")}</div></section>`}
function fabStory(f){return `<div class="kick">قصة القماش</div><h2 class="h2">${esc(f.n)}</h2><div class="swbig" style="background-color:${f.c}"></div>
 <p style="margin:0">${esc(f.feat)}.</p><dl class="kv"><dt>الموسم</dt><dd>${esc(f.sea)}</dd><dt>اللون</dt><dd>${esc(f.shade)}</dd><dt>الملمس</dt><dd>${esc(f.feel)}</dd><dt>العناية</dt><dd>${esc(f.care)}</dd></dl>
 <button class="btn" data-act="useFab" data-f="${f.i}">صمّم ثوبك من هذا القماش</button>
 <a class="btn ghost" href="${wa("السلام عليكم، أبغى أفصّل من قماش "+f.n)}" target="_blank" rel="noopener">اطلبه على واتساب</a>`}

/* ===== خزانتي ===== */
function vWard(){if(!S.me)return `<div><div class="kick">ذاكرة الخيّاط</div><h1 class="h1" style="margin-top:4px">خزانتي</h1></div><section class="card"><div class="empty">ادخل برقم ملفك عشان تشوف ثيابك وشهاداتها.<button class="btn" style="margin-top:14px" data-go="home">تسجيل الدخول</button></div></section>`;
 const done=S.me.orders.filter(o=>o.stage===5).sort((a,b)=>(b.done||0)-(a.done||0));const last=done[0];
 let h=`<div><div class="kick">ذاكرة الخيّاط</div><h1 class="h1" style="margin-top:4px">خزانتي</h1></div>`;
 if(last&&last.done&&Date.now()-last.done>300*864e5)h+=`<section class="card gold media">${vid("tape")}<div><div class="row" style="margin-bottom:6px"><span class="av" style="width:44px;height:44px">${SALEH}</span><div class="mute">تذكير من العم صالح</div></div><h2 class="h2" style="margin:4px 0 10px">مر وقت على آخر ثوب فصّلته عندنا… نجدده؟</h2><a class="btn dark" href="${wa("السلام عليكم، أبغى أجدد ثوبي بنفس المقاس — ملف "+S.me.file)}" target="_blank" rel="noopener">جدّده بنفس المقاس</a></div></section>`;
 h+=done.length?`<div class="list">${done.map(o=>`<a class="item" href="${o.cert?"../thobe/?c="+encodeURIComponent(o.cert):"#"}" target="_blank" rel="noopener"><span class="ic">${I.hang}</span><span class="grow"><b>${esc(o.item)}</b><br><span class="mute">${esc(o.fabric||"")} ${o.done?"· "+new Date(o.done).toLocaleDateString("ar-SA-u-ca-islamic",{month:"long",year:"numeric"}):""}</span></span><span class="tag">الشهادة</span></a>`).join("")}</div>`:`<section class="card"><div class="empty">أول ما تستلم ثوبك، ينحفظ هنا مع شهادة ميلاده.</div></section>`;
 h+=`<button class="item" data-act="memory"><span class="ic" style="background:#F5E7CC">${I.heart}</span><span class="grow"><b>ثوب الذكرى</b><br><span class="mute">عندك شماغ أبوك أو قماش له قصة؟ نخيطه في ثوبك.</span></span></button>`;
 return h}

/* ===== حسابي ===== */
function vMe(){const m=S.me;let h="";
 if(m)h+=`<section class="card gold"><div class="mute">ملف رقم</div><div style="font:700 40px/1.1 'Reem Kufi';letter-spacing:2px">${num(m.file)}</div><div style="margin-top:4px">${esc(m.name)}</div></section>`;
 else h+=`<section class="card"><div class="empty">ما سجّلت دخولك.<button class="btn" style="margin-top:14px" data-go="home">تسجيل الدخول</button></div></section>`;
 const it=(href,ic,t,s,ext)=>`<a class="item" href="${href}" ${ext?'target="_blank" rel="noopener"':""}><span class="ic">${ic}</span><span class="grow"><b>${t}</b>${s?`<br><span class="mute">${s}</span>`:""}</span></a>`;
 h+=`<div class="list">`;
 if(m)h+=`<button class="item" data-act="pin"><span class="ic">${I.key}</span><span class="grow"><b>${m.hasPin?"تغيير الرقم السري":"اختر رقماً سرياً خاصاً"}</b><br><span class="mute">${m.hasPin?"تدخل فيه بدل آخر ٤ أرقام من جوالك":"بدل آخر ٤ أرقام من جوالك، أأمن لك"}</span></span></button>`;
 h+=it("../card/",I.card,"بطاقة الولاء","",1)+it("../#gift",I.gift,"أهدِ ثوباً","والمقاس علينا",1)+it("../#prefs",I.star,"علّمنا وش تحب","وتوصلك الأخبار اللي تناسبك",1)+it("../#stories",I.studio,"قصص إليغانزا","حلقات قصيرة من عالمنا",1)+it(wa("السلام عليكم"),I.wa,"تواصل معنا واتساب","",1)+it("../staff/",I.team,"دخول الفريق","للموظفين فقط",1);
 if(m)h+=`<button class="item" data-act="logout"><span class="ic">${I.out}</span><span class="grow"><b>تسجيل الخروج</b></span></button>`;
 h+=`</div><section class="card" style="text-align:center"><div class="kick" style="justify-content:center">قريباً</div><b class="ttl h3">تحدي الشهر: أفضل طلّة بثوب إليغانزا</b><p class="mute" style="margin:4px 0 0">الفائز ياخذ ثوبه القادم مجاناً.</p></section>`;
 return h}

/* ===== الرسم ===== */
function render(){const t=S.tab;const V={home:vHome,studio:vStudio,fabric:vFabric,ward:vWard,me:vMe};
 $("view").innerHTML=V[t]();
 $("nav").innerHTML=TABS.map(([k,l,ic])=>`<button class="${k===t?"on":""}" data-tab="${k}" aria-current="${k===t?"page":"false"}">${ic}${l}</button>`).join("");
 $("hello").innerHTML=S.me?`مرحباً<b>${esc((S.me.name||"").split(" ")[0])}</b>`:"";
 const st=$("salehTxt");if(st)setTimeout(()=>{st.classList.remove("typing");st.textContent=st.dataset.t},800);
 document.querySelectorAll("[data-off]").forEach(c=>requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDashoffset=c.dataset.off)));
 if(t==="home"&&!S.me){const f=$("loginF");if(f)f.onsubmit=async e=>{e.preventDefault();const m=$("lMsg");m.classList.remove("bad");m.textContent="لحظة…";
  try{await login($("lFile").value.replace(/\D/g,""),$("lPass").value.replace(/\D/g,""));burst($("hello"));toast("أهلاً وسهلاً 👑")}catch(er){m.textContent=er.message;m.classList.add("bad")}}}}
function go(t){S.tab=t;closeSheet();render();scrollTo({top:STANDALONE?0:($(".app")?document.querySelector(".app").offsetTop-8:0),behavior:"smooth"})}

document.addEventListener("click",e=>{
 const tb=e.target.closest("[data-tab]");if(tb){go(tb.dataset.tab);return}
 const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
 if(e.target.id==="sheet"){closeSheet();return}
 const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
 if(act==="close")closeSheet();
 if(act==="opt"){const k=a.dataset.k;S.design[k]=k==="fab"?+a.dataset.v:a.dataset.v;LS.set("elg_design",JSON.stringify(S.design));render()}
 if(act==="runway"){const f=FAB[S.design.fab]||FAB[0];sheet(`<div class="runway">${vid("dunes")}<span class="light l1"></span><span class="light l2"></span><div class="floor"></div><div class="model">${model(S.design)}</div><div class="flash"></div><div class="name">${S.me?esc((S.me.name||"").split(" ")[0])+" · ":""}${esc(f.n)}</div></div><a class="btn" href="${wa(designMsg())}" target="_blank" rel="noopener">أرسل تصميمي للمحل</a>`)}
 if(act==="clip"){const i=+a.dataset.i;sheet(`<div class="vbox" style="aspect-ratio:9/16;height:min(62vh,560px);margin:0 auto">${vid(CLIP[i])}<div class="ov"></div><div class="tx"><div class="kick" style="color:#E3CB93">مرحلة ${num(i+1)}</div><b class="ttl h2">${esc(STAGES[i])}</b></div></div>`)}
 if(act==="fab")sheet(fabStory(FAB[+a.dataset.f]||FAB[0]));
 if(act==="useFab"){S.design.fab=+a.dataset.f;LS.set("elg_design",JSON.stringify(S.design));go("studio");toast("لبّسنا ثوبك قماش "+(FAB[S.design.fab]||FAB[0]).n)}
 if(act==="rush")sheet(`<div class="kick">تعديل مستعجل</div><h2 class="h2">وش يحتاج ثوبك؟</h2><div class="chips" id="rushC">${["تقصير","توسيع","تضييق","زر أو سحاب","شي ثاني"].map((t,i)=>`<button class="chip ${i===0?"on":""}" data-act="pick">${t}</button>`).join("")}</div><p class="mute" style="margin:0">بعد ما يفتح الواتساب، أرسل صورة الثوب ونرد عليك بالوقت والسعر.</p><button class="btn" data-act="rushGo">أرسل على واتساب</button>`);
 if(act==="pick")a.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===a));
 if(act==="rushGo"){const t=(document.querySelector("#rushC .chip.on")||{}).textContent||"";window.open(wa("السلام عليكم، عندي تعديل مستعجل: "+t+(S.me?" — ملف "+S.me.file:"")),"_blank");closeSheet()}
 if(act==="memory")sheet(`<div class="vbox" style="height:200px">${vid("book")}<div class="ov"></div></div><div class="kick">ثوب الذكرى</div><h2 class="h2">قماش له قصة، يرجع يعيش معك</h2><p style="margin:0">جيب قطعة قماش غالية عليك، مثل شماغ أبوك أو بشت جدك، ونخيطها في ثوبك الجديد: بطانة الياقة أو داخل الكبك أو الجيب.</p><div class="list"><div class="note">١. اكتب لنا قصة القماش بسطرين</div><div class="note">٢. جيبه للمحل مع موعد المقاس</div><div class="note">٣. تنحفظ القصة في شهادة ميلاد ثوبك</div></div><a class="btn" href="${wa("السلام عليكم، أبغى ثوب ذكرى"+(S.me?" — ملف "+S.me.file:""))}" target="_blank" rel="noopener">أبغى ثوب ذكرى</a>`);
 if(act==="book"){const m=S.me;sheet(`<div class="kick">${esc(S.seats.title||"مقاعد الموسم")}</div><h2 class="h2">كم ثوب تبغى؟</h2><input class="in" id="bPcs" type="number" min="1" max="20" value="1" dir="ltr"><button class="btn" data-act="bookGo">احجز</button><div class="msg" id="bMsg"></div>`)}
 if(act==="bookGo"){(async()=>{const m=$("bMsg");m.textContent="لحظة…";m.classList.remove("bad");
  try{const r=await api("book",{token:S.tok,pieces:$("bPcs").value});S.seats.left=r.left;closeSheet();render();toast("حجزنا لك المقعد رقم "+num(r.n)+"، بنتواصل معك لموعد المقاس 🎉")}catch(er){m.classList.add("bad");m.textContent=er.message}})()}
 if(act==="pin")sheet(`<div class="kick">الرقم السري</div><h2 class="h2">اختر رقماً سرياً من ٤ إلى ٦ أرقام</h2><input class="in" id="pin1" type="password" inputmode="numeric" maxlength="6" dir="ltr" placeholder="••••"><input class="in" id="pin2" type="password" inputmode="numeric" maxlength="6" dir="ltr" placeholder="أعد كتابته"><button class="btn" data-act="pinGo">احفظ</button><div class="msg" id="pMsg"></div>`);
 if(act==="pinGo"){(async()=>{const m=$("pMsg"),p1=$("pin1").value,p2=$("pin2").value;m.classList.add("bad");
  if(!/^\d{4,6}$/.test(p1)){m.textContent="من ٤ إلى ٦ أرقام";return}if(p1!==p2){m.textContent="الرقمين مو متطابقين";return}
  m.classList.remove("bad");m.textContent="لحظة…";try{await api("app-pin",{token:S.tok,pin:p1});S.me.hasPin=true;closeSheet();render();toast("انحفظ رقمك السري، ادخل فيه من الحين")}catch(er){m.classList.add("bad");m.textContent=er.message}})()}
 if(act==="logout")logout();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ===== رمز القماش: /app/#fab-2 ===== */
function hashRoute(){const m=location.hash.match(/^#fab-(\d+)$/);if(m){S.tab="fabric";render();const f=FAB[+m[1]];if(f)setTimeout(()=>sheet(fabStory(f)),300)}}
window.addEventListener("hashchange",hashRoute);

/* ===== التشغيل ===== */
(async()=>{
 guide();
 if(STANDALONE&&!sessionStorage.getItem("elg_intro")){try{sessionStorage.setItem("elg_intro","1")}catch(e){}
  const d=document.createElement("div");d.className="intro";d.innerHTML='<video src="../media/intro.mp4" poster="../media/intro.jpg" autoplay muted playsinline></video><button class="skip" type="button">تخطّي</button>';document.body.appendChild(d);
  const end=()=>{if(!d.classList.contains("out")){d.classList.add("out");setTimeout(()=>d.remove(),700)}};d.querySelector(".skip").onclick=end;const v=d.querySelector("video");v.addEventListener("ended",end);v.addEventListener("error",end);setTimeout(end,6500)}
 const cached=LS.get("elg_me");if(S.tok&&cached){try{S.me=JSON.parse(cached)}catch(e){}}
 render();
 fetch("../content.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{if(j&&j.whatsapp)WA=String(j.whatsapp).replace(/\D/g,"")||WA;if(j&&j.fabrics)setFabs(j.fabrics);if(j&&j.journey){const s=lines(j.journey).map(r=>r[0]);if(s.length>=6)STAGES=s.slice(0,6)}render();hashRoute()}).catch(()=>hashRoute());
 api("seats").then(s=>{S.seats=s;if(S.tab==="home")render()}).catch(()=>{});
 await loadMe();render();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.tok)loadMe().then(render)});
}
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer onload="window.dispatchEvent(new Event('qrready'))"></script>
</body>
</html>
