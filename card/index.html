<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقة ولاء إليجانزا</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بطاقة إليجانزا">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="loyalty.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="card">
    <div class="brand"><div class="word"><span>El</span>eganza</div><div class="right"><button class="langb" id="langBtn" type="button">English</button><svg width="32" height="24" viewBox="0 0 34 24" aria-hidden="true"><path d="M3 20 L1 6 L10 13 L17 2 L24 13 L33 6 L31 20 Z" fill="#F2C200"/></svg></div></div>
    <div class="sub" data-i="sub">بطاقة الولاء · للخياطة</div>
  </header>

  <section id="vList" class="view">
    <button class="btn" id="newBtn" data-i="newCard">سوّ بطاقتك الجديدة</button>
    <p class="rules" data-ih="rules"></p>
    <h2 data-i="cards">البطايق</h2>
    <input id="search" data-ip="search" data-ia="search">
    <div id="list" class="list"><div class="hint" data-i="loading">جاري التحميل…</div></div>
  </section>

  <section id="vNew" class="view hidden">
    <h2 data-i="newH">بطاقة جديدة</h2>
    <fieldset class="seg"><legend data-i="visQ"></legend>
      <label><input type="radio" name="vis" value="name" checked> <span data-i="visName"></span></label>
      <label><input type="radio" name="vis" value="anon"> <span data-i="visAnon"></span></label>
    </fieldset>
    <div id="nameBox"><label for="rName" data-i="name"></label><input id="rName" autocomplete="name" maxlength="40"></div>
    <div><label for="rPhone" data-i="phone"></label><input id="rPhone" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="05xxxxxxxx"></div>
    <div><label for="rCode" data-i="code"></label><input id="rCode" type="password" inputmode="numeric" maxlength="7" autocomplete="new-password" dir="ltr"></div>
    <div><label for="rCode2" data-i="code2"></label><input id="rCode2" type="password" inputmode="numeric" maxlength="7" autocomplete="new-password" dir="ltr"></div>
    <div class="err" id="rErr" role="alert"></div>
    <button class="btn" id="rBtn" data-i="create"></button>
    <button class="btn ghost" data-back data-i="back"></button>
  </section>

  <section id="vOpen" class="view hidden">
    <h2 id="oLabel"></h2>
    <div><label for="oCode" data-i="cardCode"></label><input id="oCode" type="password" inputmode="numeric" maxlength="7" autocomplete="current-password" dir="ltr"></div>
    <div class="err" id="oErr" role="alert"></div>
    <button class="btn" id="oBtn" data-i="open"></button>
    <button class="btn ghost" data-back data-i="back"></button>
  </section>

  <section id="vCard" class="view hidden">
    <div class="row">
      <div><div class="lbl" data-i="holder"></div><div class="name" id="cLabel"></div><div class="lbl" dir="ltr" id="cPhone"></div></div>
      <div><div class="lbl" data-i="stamps"></div><div class="count" id="cCount"></div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div id="banners"></div>
    <div class="qrbox"><div id="qr" role="img" data-ia="qrAria"></div><div class="hint" data-i="qrHint"></div></div>
    <button class="btn ghost" id="refresh" data-i="refresh"></button>
    <details class="hist"><summary data-i="history"></summary><div id="hist"></div></details>
    <p class="hint" id="installHint" data-ih="install"></p>
    <button class="btn ghost" id="logout" data-i="lock"></button>
  </section>
</div>

<script src="loyalty-common.js"></script>
<script>
const TOKEN_KEY = 'eleganza_card_token';
let token = null; try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
let allCards = [], openId = null, openLabel = '', currentCard = null;
const $ = id => document.getElementById(id);

function go(v) { document.querySelectorAll('.view').forEach(x => x.classList.toggle('hidden', x.id !== v)); window.scrollTo(0, 0); }
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { go('vList'); loadList(); });

async function loadList() {
  try { allCards = (await api('list')).cards; renderList(); }
  catch (e) { $('list').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}
function renderList() {
  const q = $('search').value.trim();
  const box = $('list'); box.innerHTML = '';
  const rows = allCards.filter(c => !q || c.label.includes(q) || label(c.label).toLowerCase().includes(q.toLowerCase()));
  if (!rows.length) { box.innerHTML = '<div class="hint">' + tr('noCards') + '</div>'; return; }
  rows.forEach(c => {
    const b = document.createElement('button'); b.className = 'item'; b.type = 'button';
    b.innerHTML = '<span>' + esc(label(c.label)) + '</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B69A66" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    b.onclick = () => { openId = c.id; openLabel = c.label; $('oLabel').textContent = label(c.label); $('oCode').value = ''; $('oErr').textContent = ''; go('vOpen'); $('oCode').focus(); };
    box.appendChild(b);
  });
}
$('search').oninput = renderList;
$('newBtn').onclick = () => go('vNew');
document.querySelectorAll('input[name=vis]').forEach(r => r.onchange = () => $('nameBox').classList.toggle('hidden', document.querySelector('input[name=vis]:checked').value === 'anon'));

function saveToken(t) { token = t; try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }

$('rBtn').onclick = async () => {
  const e = $('rErr'); e.textContent = '';
  const anonymous = document.querySelector('input[name=vis]:checked').value === 'anon';
  const code = digits($('rCode').value), code2 = digits($('rCode2').value);
  if (!/^\d{7}$/.test(code)) { e.textContent = tr('errCode7'); return; }
  if (code !== code2) { e.textContent = tr('errMatch'); return; }
  busy('rBtn', true);
  try {
    const r = await api('register', { anonymous, name: $('rName').value, phone: digits($('rPhone').value), code });
    saveToken(r.token); showCard(r.card);
  } catch (x) { e.textContent = x.message; }
  busy('rBtn', false);
};

$('oBtn').onclick = async () => {
  const e = $('oErr'); e.textContent = '';
  busy('oBtn', true);
  try { const r = await api('open', { id: openId, code: digits($('oCode').value) }); saveToken(r.token); showCard(r.card); }
  catch (x) { e.textContent = x.message; }
  busy('oBtn', false);
};
$('oCode').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('oBtn').click(); });

function showCard(c, stay) {
  currentCard = c;
  if (!stay) go('vCard');
  $('cLabel').textContent = label(c.label);
  $('cPhone').textContent = c.phone;
  $('cCount').textContent = AR(c.stamps) + ' / ' + AR(c.total);
  renderStamps($('grid'), c);
  renderBanners($('banners'), c);
  if (window.qrcode) { const qr = qrcode(0, 'M'); qr.addData('ELGZ:' + c.id); qr.make(); $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2 }); }
  $('hist').innerHTML = histHTML(c);
}
async function refresh() {
  try { showCard((await api('me', { token })).card); }
  catch (e) {
    if (e.status === 401 || e.status === 404) { try { localStorage.removeItem(TOKEN_KEY); } catch (x) {} token = null; }
    go('vList'); loadList();
  }
}
$('refresh').onclick = refresh;
$('logout').onclick = () => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} token = null; currentCard = null; go('vList'); loadList(); };
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('installHint').style.display = 'none';

initLang('title', () => {
  renderList();
  if (openLabel) $('oLabel').textContent = label(openLabel);
  if (currentCard) showCard(currentCard, true);
  ['rErr', 'oErr'].forEach(id => $(id).textContent = '');
});
if (token) refresh(); else loadList();
</script>
</body>
</html>
